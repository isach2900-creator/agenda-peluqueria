<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Peluquería | Gestión en Vivo</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { max-width: 900px; width: 100%; display: flex; flex-direction: column; gap: 2rem; }
    
    header { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; }
    header h1 { font-size: 2.2rem; color: var(--accent); margin-bottom: 0.5rem; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1.5fr; } }

    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    .card h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

    form { display: flex; flex-direction: column; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
    label { font-size: 0.85rem; color: var(--text-muted); }
    input, select { background-color: #0f172a; border: 1px solid var(--border); color: var(--text-main); padding: 0.6rem 0.8rem; border-radius: 6px; outline: none; }
    input:focus { border-color: var(--accent); }

    button { background-color: var(--accent); color: #000; font-weight: 600; border: none; padding: 0.7rem; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: var(--accent-hover); color: #fff; }

    .citas-list { display: flex; flex-direction: column; gap: 0.8rem; }
    .cita-item { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .cita-info h3 { font-size: 1rem; margin-bottom: 0.2rem; }
    .cita-info p { font-size: 0.85rem; color: var(--text-muted); }
    
    .badge { padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
    .badge.CONFIRMADA { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
    .badge.PENDIENTE { background: rgba(234, 179, 8, 0.2); color: #eab308; border: 1px solid #eab308; }
    .badge.CANCELADA { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    .actions { display: flex; gap: 0.5rem; }
    .btn-danger { background-color: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 0.3rem 0.6rem; font-size: 0.8rem; }
    .btn-danger:hover { background-color: var(--danger); color: #fff; }

    footer { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 1rem; }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>💈 Agenda Peluquería</h1>
      <p>Sistema de Gestión de Citas interactivo basado en arquitectura Java MVC-lite</p>
    </header>

    <div class="grid">
      <!-- Formulario para agregar cita -->
      <div class="card">
        <h2>Registrar Cita</h2>
        <form id="citaForm">
          <div class="form-group">
            <label for="cliente">Nombre del Cliente</label>
            <input type="text" id="cliente" placeholder="Ej. Carlos" required>
          </div>
          <div class="form-group">
            <label for="servicio">Servicio</label>
            <input type="text" id="servicio" placeholder="Ej. Corte y barba" required>
          </div>
          <div class="form-group">
            <label for="fechaHora">Fecha y Hora</label>
            <input type="text" id="fechaHora" placeholder="2026-11-21 11:00" required>
          </div>
          <button type="submit">Agregar a la Agenda</button>
        </form>
      </div>

      <!-- Listado de citas -->
      <div class="card">
        <h2>Citas Programadas</h2>
        <div id="citasContainer" class="citas-list">
          <!-- Las citas se renderizan dinámicamente aquí -->
        </div>
      </div>
    </div>

    <footer>
      <p>Código fuente disponible en <a href="https://github.com/isach2900-creator/agenda-peluqueria" target="_blank">GitHub Repository</a></p>
    </footer>
  </div>

  <script>
    // Lógica réplica del backend Java en JS
    class Cita {
      constructor(cliente, servicio, fechaHora) {
        this.cliente = cliente;
        this.servicio = servicio;
        this.fechaHora = fechaHora;
        this.estado = "PENDIENTE";
      }

      confirmar() { this.estado = "CONFIRMADA"; }
      cancelar() { this.estado = "CANCELADA"; }
    }

    class Agenda {
      constructor() { this.citas = []; }
      agregarCita(cita) { this.citas.push(cita); }
      buscarPorCliente(nombre) {
        return this.citas.find(c => c.cliente.toLowerCase() === nombre.toLowerCase());
      }
      cancelarCitaPorCliente(nombre) {
        const cita = this.buscarPorCliente(nombre);
        if (cita) { cita.cancelar(); return true; }
        return false;
      }
    }

    const miAgenda = new Agenda();

    // Cargas iniciales como en Main.java
    const cita1 = new Cita("Carlos", "Corte y barba", "2026-11-21 11:00");
    cita1.confirmar();
    const cita2 = new Cita("Mateo", "Corte degradado", "2026-11-21 12:30");

    miAgenda.agregarCita(cita1);
    miAgenda.agregarCita(cita2);

    function renderCitas() {
      const container = document.getElementById('citasContainer');
      container.innerHTML = '';

      if (miAgenda.citas.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No hay citas registradas.</p>';
        return;
      }

      miAgenda.citas.forEach(cita => {
        const div = document.createElement('div');
        div.className = 'cita-item';
        div.innerHTML = `
          <div class="cita-info">
            <h3>${cita.cliente} <span class="badge ${cita.estado}">${cita.estado}</span></h3>
            <p>${cita.servicio} — <strong>${cita.fechaHora}</strong></p>
          </div>
          <div class="actions">
            ${cita.estado !== 'CANCELADA' ? `<button class="btn-danger" onclick="cancelar('${cita.cliente}')">Cancelar</button>` : ''}
          </div>
        `;
        container.appendChild(div);
      });
    }

    document.getElementById('citaForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const cliente = document.getElementById('cliente').value;
      const servicio = document.getElementById('servicio').value;
      const fechaHora = document.getElementById('fechaHora').value;

      miAgenda.agregarCita(new Cita(cliente, servicio, fechaHora));
      document.getElementById('citaForm').reset();
      renderCitas();
    });

    window.cancelar = function(nombre) {
      miAgenda.cancelarCitaPorCliente(nombre);
      renderCitas();
    };

    renderCitas();
  </script>
</body>
</html>
